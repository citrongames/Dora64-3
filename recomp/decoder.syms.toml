# Names describe semantics established from Doraemon 3 machine code.
[[section]]
name = ".decoder_probe"
rom = 0x1000
vram = 0x80025C00
size = 0x58E80
functions = [
    { name = "read_rom_dma", vram = 0x8002730C, size = 0x108 },
    { name = "read_compressed_byte", vram = 0x80034000, size = 0xD0 },
    { name = "write_decoded_byte", vram = 0x800340D0, size = 0x18 },
    { name = "recomp_entrypoint", vram = 0x800340E8, size = 0x304 },
]
